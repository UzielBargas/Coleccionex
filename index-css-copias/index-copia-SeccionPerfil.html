<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleccionex</title>
    <link rel="stylesheet" href="Estilos-copia.css">
    
</head>
<body>
    <div id="contenedor-padre">
        <div id="encabezado">
            <img src="../imagenes/imagen_logo.jpg">
            <a class="acceso-usuario" href="paginas/sesion.html">Iniciar sesión</a>
        </div>
        <div id="panel-menu">
            <div id="texto-panel">
                PANEL DE CLIENTE - BIENVENIDO USUARIO
            </div>
            <nav id="menu">

                    <button class="nav-btn" data-target="perfil"> Mi perfil  
                    </button>

                
                    <button class="nav-btn" data-target="cartas"> Mis cartas / mazos 
                    </button>
               
                    <button class="nav-btn" data-target="mercado"> Mercado
                    </button>

                
            </nav>
           
                
        </div>
        <div id="cuerpo">
            <section id="perfil" class="seccion">
                hola
                </section>

                <section id="cartas" class="seccion"> 
                    <div id="estilos-cartas">
                        <div id="mazos"><!-- 1 lateral izquierda, ocupa todo el largo del cuerpo pero menos de la mitad del ancho del cuerpo-->
                            <div id="texto-titulo">MIS MAZOS</div>
                            <div class="coleccion-mazos">
                                <img src="../imagenes/Imagen coleccion cartas ejemplo.png">Mazo principal - Blue-Eyes
                                
                            </div>
                        </div> 
                        <div id="detalles-mazo">
                            hola
                        </div>
                        <div id="historial-cartas">
                            hi
                        </div>
                        <div id="cartas-sin-mazo">
                            hello
                        </div>
                    </div>
                </section>

                <section id="mercado" class="seccion activa">
                    holo2
                </section>

        </div>
        <footer id="pie">
            <a href="paginas/sobre-nosotros.html">Sobre nosotros</a>
            <a href="paginas/historial.html">Historial de transacciones</a>
        </footer>
    </div>
   

    <script src="../java/funciones.js"></script>
</body>
</html>
