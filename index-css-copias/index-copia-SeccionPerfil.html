<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleccionex</title>
    <link rel="stylesheet" href="Estilos-copia.css">
    
</head>
<body>
    <div id="contenedor-padre">
        <div id="encabezado">
            <img src="../imagenes/imagen_logo.jpg">
        </div>
        <div id="panel-menu">
            <div id="texto-panel">
                PANEL DE CLIENTE - BIENVENIDO USUARIO
            </div>
            <nav id="menu">

                    <button class="nav-btn" data-target="perfil"> Mi perfil  
                    </button>

                
                    <button class="nav-btn" data-target="cartas"> Mis cartas / mazos 
                    </button>
               
                    <button class="nav-btn" data-target="mercado"> Mercado
                    </button>

                
                    <button class="nav-btn" data-target="historial-transacciones"> Historial de transacciones  
                    </button>
             
                

            </nav>
           
                
        </div>
        <div id="cuerpo">
            <section id="perfil" class="seccion">
                hola
                </section>

                <section id="cartas" class="seccion"> 
                    <div id="estilos-cartas">
                        <div id="mazos"><!-- 1 lateral izquierda, ocupa todo el largo del cuerpo pero menos de la mitad del ancho del cuerpo-->
                            <div class="coleccion-mazos">
                                <img src="../imagenes/Imagen coleccion cartas ejemplo.png">Mazo principal - Blue-Eyes
                                
                            </div>
                        </div> 
                        <div id="detalles-mazo">
                            hola
                        </div>
                        <div id="historial-cartas">
                            hi
                        </div>
                        <div id="cartas-sin-mazo">
                            hello
                        </div>
                    </div>
                </section>

                <section id="mercado" class="seccion activa">
                    holo2
                </section>

                <section id="historial-transacciones" class="seccion">
                    holo3
                </section>
        </div>
    
    </div>
    <div id="overlay">
<div class="login">
    <h2>Iniciar sesión</h2>
    <form action="#">
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" name="usuario" required>
        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena" required>
        <button type="submit">Iniciar sesión</button>
        <a href="#" id="cerrar-overlay">¿Olvidaste tu contraseña?</a>
    </form>
</div>
    </div>

    <script src="../java/funciones.js"></script>
</body>
</html>
