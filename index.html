<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleccionex</title>
    <link rel="stylesheet" href="css/Estilos.css">
    
</head>
<body>
    <div id="contenedor-padre">
        <div id="encabezado">Coleccionex</div>
        <div id="panel-menu">
            <nav class="menu">

                    <button class="nav-btn" data-target="perfil"> Mi perfil  
                    </button>

                
                    <button class="nav-btn" data-target="cartas"> Mis cartas / mazos 
                    </button>
               
                    <button class="nav-btn" data-target="mercado"> Mercado
                    </button>

                
                    <button class="nav-btn" data-target="historial-transacciones"> Historial de transacciones  
                    </button>
             
                

            </nav>
           
                
        </div>
        <div id="cuerpo">
            <section id="perfil" class="seccion">
                hola
                </section>

                <section id="cartas" class="seccion"> 
                holo 1
                </section>

                <section id="mercado" class="seccion activa">
                    holo2
                </section>

                <section id="historial-transacciones" class="seccion">
                    holo3
                </section>
        </div>
    
    </div>
    <div id="overlay">
<div class="login">
    <h2>Iniciar sesión</h2>
    <form action="#">
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" name="usuario" required>
        <label for="contrasena">Contraseña:</label>
        <input type="password" id="contrasena" name="contrasena" required>
        <button type="submit">Iniciar sesión</button>
        <a href="#" id="cerrar-overlay">¿Olvidaste tu contraseña?</a>
    </form>
</div>
    </div>

    <script src="java/funciones.js"></script>
</body>
</html>
