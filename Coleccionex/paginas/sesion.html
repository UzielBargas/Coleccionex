<!DOCTYPE html>
<html lang="es">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleccionex</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="../css/sesion.css">
 </head>
 <body>
   <header class="encabezado">
      <a href="../index.html">
         <img src="../imagenes/imagen_logo.jpg" alt="Logo de Coleccionex" class="logo">
      </a>
   </header>
   <main class="contenido">
      <section class="caja-login">
         <h1>Iniciar sesion</h1>
         <p>Entra a tu coleccion de cartas</p>
         <!-- id para que JavaScript lo encuentre; los name son los que PHP lee en $_POST -->
         <form id="form-login">
            <label for="usuario">Usuario o correo</label>
            <input type="text" id="usuario" name="usuario" placeholder="Escribe tu usuario" required autocomplete="username">
            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Escribe tu contraseña" required autocomplete="current-password">
            <button type="submit">Entrar</button>
            <p class="mensaje" id="mensaje"></p>
         </form>
         <p class="registro">¿No tenes una cuenta? <a href="registro.html">Registrate</a></p>
      </section>
   </main>
   <script src="../js/sesion.js" defer></script>
 </body>
</html>
